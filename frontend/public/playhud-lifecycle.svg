<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="t d">
  <title id="t">Playhud lifecycle flow</title>
  <desc id="d">A six-step loop: the itch to play, join Playhud, match your vibe, find your people, lock the plan, show up and play, then repeat with better matches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e54"/>
      <stop offset=".55" stop-color="#101caa"/>
      <stop offset="1" stop-color="#080b3c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aebaff"/>
      <stop offset=".48" stop-color="#3d50ff"/>
      <stop offset="1" stop-color="#1027f5"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3d50ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3d50ff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4cbff"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, "Avenir Next", Avenir, Arial, sans-serif; }
    .title { font-size: 34px; font-weight: 750; fill: #fff; letter-spacing: -1px; }
    .sub { font-size: 15px; fill: #aebaff; }
    .card { fill: #ffffff; fill-opacity: .08; stroke: #ffffff; stroke-opacity: .22; stroke-width: 1.5; }
    .card.hot { fill: #d9f99d; fill-opacity: 1; stroke: none; }
    .h { font-size: 19px; font-weight: 700; fill: #fff; }
    .p { font-size: 13px; fill: #c9d0ff; }
    .hot-h { fill: #1a2e05; }
    .hot-p { fill: #365314; }
    .num { font-size: 14px; font-weight: 800; fill: #1a1550; }
    .flow { fill: none; stroke: #c4cbff; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 3 9; marker-end: url(#arrow); animation: dash 1.2s linear infinite; }
    .loop { stroke: #d9f99d; }
    .small { font-size: 12px; fill: #d9f99d; font-weight: 600; letter-spacing: .5px; }
    .center-w { font-size: 38px; font-weight: 750; fill: #fff; letter-spacing: -2px; }
    .center-s { font-size: 13px; fill: #aebaff; letter-spacing: 3px; }
    .foot { font-size: 15px; fill: #8c9aff; letter-spacing: .3px; }
    .pulse { transform-origin: 600px 400px; animation: pulse 3s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%,100% { opacity: .75; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <rect width="1200" height="740" rx="28" fill="url(#bg)"/>

  <text class="title" x="600" y="66" text-anchor="middle">The Playhud lifecycle</text>
  <text class="sub" x="600" y="96" text-anchor="middle">From dead group chat to game on, and back again</text>

  <!-- centre -->
  <circle class="pulse" cx="600" cy="400" r="150" fill="url(#halo)"/>
  <circle cx="600" cy="400" r="108" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.5"/>
  <g transform="translate(550 322) scale(.38)">
    <circle cx="92" cy="180" r="17" fill="#c4cbff"/>
    <path d="M145 130 Q132 104 158 86 Q176 73 198 82 L306 126 Q354 145 354 181 Q354 208 326 226 L223 289 Q203 302 191 288 Q182 278 190 260 L229 211 L164 183 Q143 174 145 153 Z" fill="url(#mark)"/>
    <path d="M143 139 H239 Q259 139 259 159 Q259 178 239 178 H166 L151 210 Q143 226 129 219 Q115 211 122 195 Z" fill="#b5bfff" opacity=".95"/>
    <path d="M166 178 H229 L202 267 Q195 289 175 285 Q155 281 162 259 Z" fill="#a9b6ff" opacity=".96"/>
    <path d="M222 210 L303 163 Q321 153 336 164 Q351 175 335 190 L245 245 Q229 254 219 243 Q211 233 222 210 Z" fill="#142df0" opacity=".82"/>
  </g>
  <text class="center-w" x="600" y="448" text-anchor="middle">playhud</text>
  <text class="center-s" x="600" y="474" text-anchor="middle">LET'S PLAY</text>

  <!-- flow arrows (drawn first so cards sit on top) -->
  <path class="flow" d="M722 180 Q929 160 929 240"/>
  <path class="flow" d="M929 338 L929 460"/>
  <path class="flow" d="M929 560 Q929 620 722 620"/>
  <path class="flow" d="M478 620 Q271 620 271 560"/>
  <path class="flow" d="M271 460 L271 338"/>
  <path class="flow loop" d="M271 240 Q271 180 478 180"/>
  <text class="small" x="352" y="152" text-anchor="middle">REPEAT · BETTER MATCHES EACH TIME</text>

  <!-- 1 the itch -->
  <g transform="translate(480 132)">
    <rect class="card" width="240" height="96" rx="18"/>
    <circle cx="0" cy="0" r="16" fill="#c4cbff"/><text class="num" x="0" y="5" text-anchor="middle">1</text>
    <text class="h" x="26" y="38">The itch</text>
    <text class="p" x="26" y="60">Group chat's dead, plans never</text>
    <text class="p" x="26" y="78">happen. You want to play.</text>
  </g>

  <!-- 2 join -->
  <g transform="translate(809 242)">
    <rect class="card" width="240" height="96" rx="18"/>
    <circle cx="0" cy="0" r="16" fill="#c4cbff"/><text class="num" x="0" y="5" text-anchor="middle">2</text>
    <text class="h" x="26" y="38">Join Playhud</text>
    <text class="p" x="26" y="60">Pick your sport and level:</text>
    <text class="p" x="26" y="78">beginner, comeback or new.</text>
  </g>

  <!-- 3 match -->
  <g transform="translate(809 462)">
    <rect class="card" width="240" height="96" rx="18"/>
    <circle cx="0" cy="0" r="16" fill="#c4cbff"/><text class="num" x="0" y="5" text-anchor="middle">3</text>
    <text class="h" x="26" y="38">Match your vibe</text>
    <text class="p" x="26" y="60">Pace, goals and schedule</text>
    <text class="p" x="26" y="78">line up with the right people.</text>
  </g>

  <!-- 4 find -->
  <g transform="translate(480 572)">
    <rect class="card" width="240" height="96" rx="18"/>
    <circle cx="0" cy="0" r="16" fill="#c4cbff"/><text class="num" x="0" y="5" text-anchor="middle">4</text>
    <text class="h" x="26" y="38">Find your people</text>
    <text class="p" x="26" y="60">Get matched with partners</text>
    <text class="p" x="26" y="78">and groups near you.</text>
  </g>

  <!-- 5 plan -->
  <g transform="translate(151 462)">
    <rect class="card" width="240" height="96" rx="18"/>
    <circle cx="0" cy="0" r="16" fill="#c4cbff"/><text class="num" x="0" y="5" text-anchor="middle">5</text>
    <text class="h" x="26" y="38">Lock the plan</text>
    <text class="p" x="26" y="60">Choose time and place,</text>
    <text class="p" x="26" y="78">no more dead group chat.</text>
  </g>

  <!-- 6 play -->
  <g transform="translate(151 242)">
    <rect class="card hot" width="240" height="96" rx="18"/>
    <circle cx="0" cy="0" r="16" fill="#1a2e05"/><text class="num" x="0" y="5" text-anchor="middle" style="fill:#d9f99d">6</text>
    <text class="h hot-h" x="26" y="38">Show up and play</text>
    <text class="p hot-p" x="26" y="60">Just show up.</text>
    <text class="p hot-p" x="26" y="78">Let's play.</text>
  </g>

  <text class="foot" x="600" y="712" text-anchor="middle">Beginner, comeback player, or trying something new? We'll help you find your perfect playing partner.</text>
</svg>